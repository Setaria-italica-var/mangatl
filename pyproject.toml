[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mangatl"
version = "0.3.0"
description = "One-click local manga translation: detect, OCR, LLM translate, erase, typeset (incl. vertical)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "mangatl contributors" }]
keywords = ["manga", "comic", "translation", "ocr", "inpainting", "typesetting", "japanese", "chinese"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Natural Language :: Chinese (Simplified)",
  "Natural Language :: Japanese",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]
# Runtime deps are pinned in requirements.txt and installed into runtime/ by setup.bat.
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8"]
# 图像处理（纯色快路径、后续的 LaMa）
vision = ["numpy>=1.26", "pillow>=10"]
gui = ["PySide6>=6.6", "PySide6-Fluent-Widgets>=1.7"]

[project.urls]
Homepage = "https://github.com/Setaria-italica-var/mangatl"
Documentation = "https://github.com/Setaria-italica-var/mangatl/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/mangatl"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["dist", "runtime", "data", ".tmp", ".pytest-run", "samples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Vendored GPL-3.0 model code: keep it byte-identical to upstream.
"src/mangatl/adapters/ocr/mit48px_model.py" = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"